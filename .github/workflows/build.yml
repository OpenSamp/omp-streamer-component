name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: ['*', '*/*', '**']

jobs:
  windows:
    name: windows-${{ matrix.arch }}-${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
        config: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Declare github variables
        id: vars
        shell: bash
        run: |
          echo "branch=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Map arch to -A flag
        id: arch
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "x86" ]; then
            echo "cmake_arch=Win32" >> "$GITHUB_OUTPUT"
          else
            echo "cmake_arch=x64" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        shell: bash
        run: |
          # No -G on purpose: CMake selects the newest Visual Studio installed on
          # the runner. Pinning "Visual Studio 17 2022" broke once windows-latest
          # moved to VS 18 and stopped shipping that generator, and pinning the
          # runner image instead only moves the expiry date. -A still picks the
          # target architecture.
          cmake -B build \
            -A ${{ steps.arch.outputs.cmake_arch }} \
            -DSTREAMER_ARCH=${{ matrix.arch }} \
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build
        shell: bash
        run: cmake --build build --config ${{ matrix.config }} -j

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamer-windows-${{ matrix.arch }}-${{ matrix.config }}-${{ steps.vars.outputs.date }}-${{ steps.vars.outputs.sha_short }}
          path: build/bin/${{ matrix.config }}/streamer.dll
          if-no-files-found: error

  linux:
    name: linux-${{ matrix.arch }}-${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
        config: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Declare github variables
        id: vars
        shell: bash
        run: |
          echo "branch=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Install toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build
          if [ "${{ matrix.arch }}" = "x86" ]; then
            sudo apt-get install -y gcc-multilib g++-multilib libstdc++6:i386 libc6-dev-i386
          fi

      - name: Configure
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DSTREAMER_ARCH=${{ matrix.arch }} \
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build
        run: cmake --build build -j

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamer-linux-${{ matrix.arch }}-${{ matrix.config }}-${{ steps.vars.outputs.date }}-${{ steps.vars.outputs.sha_short }}
          path: build/bin/streamer.so
          if-no-files-found: error

  linux-asan:
    # AddressSanitizer smoke-build: verifies the plugin still compiles cleanly under
    # ASAN on Linux x64. No runtime test yet — just catches obvious ODR / unaligned
    # access / unsafe-cast regressions before they hit production.
    name: linux-x64-asan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure (ASAN)
        run: |
          cmake -B build-asan \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSTREAMER_ARCH=x64 \
            -DSTREAMER_ASAN=ON \
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build (ASAN)
        run: cmake --build build-asan -j

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package releases
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          tag="${GITHUB_REF#refs/tags/}"
          mkdir -p dist

          package_one() {
            local os="$1" arch="$2" binary="$3"
            local src_glob="artifacts/streamer-${os}-${arch}-Release-*"
            local src=( $src_glob )
            if [ ${#src[@]} -eq 0 ]; then
              echo "::error::No Release artifact found for ${os}-${arch}"
              exit 1
            fi

            local stage="pack/streamer-${os}-${arch}"
            rm -rf "$stage"
            mkdir -p "$stage"
            cp "${src[0]}/${binary}" "$stage/"
            cp streamer.inc README.md CHANGES.md LICENSE.md "$stage/"

            (cd pack && zip -r "../dist/streamer-${tag}-${os}-${arch}.zip" "streamer-${os}-${arch}")
          }

          package_one windows x86 streamer.dll
          package_one windows x64 streamer.dll
          package_one linux   x86 streamer.so
          package_one linux   x64 streamer.so

          ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
